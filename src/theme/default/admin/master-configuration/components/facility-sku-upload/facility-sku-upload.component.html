<div class="col-12">
    <div class="breadcrumbs-row noborder">
        <div class="bc-col">
        </div>
        <div class="bc-col-btn ap-col-btn flex search-exp bulk-header">
            <a href="assets/default-download/Facility-sku-Mapping.csv"  class="ripple flex"> Download CSV</a>
        </div>
    </div>
</div>



<div class="bup-file-upload">

    <h3>File Upload</h3>

    <div class="csv-upload flex">

        <div class="browse-upload">
            <p>{{'Only .CSV files accepted'| translate}}</p>
            <div class="bu-box flex cursor">
                <input class="cursor" #fileInput type="file" [(ngModel)]="uploadFile" accept=".csv"
                    (change)="onUpload($event)">
                <a href="javascript:void(0)">{{'catalog.product.BrowseanduploadFiles'| translate}}</a>
            </div>
            <div class="error" *ngIf="(!csvFile && uploadSubmit)"> {{'catalog.product.Nofilechosen'| translate}}</div>
            <div class="fil-name">{{csvFileName}}</div>
        </div>

    </div>
    <!--Row-->

    <div class="all-btn flex">
        <button type="submit" class="ripple allocate" (click)="uploadSuccess()">
            <span>{{'catalog.product.Upload'| translate}}</span></button>
        <button class="ripple" (click)="reset(fileInput)">{{'catalog.product.Reset'| translate}}</button>
    </div>

</div>

<app-popup-message [popupMessage]="popupMessage"></app-popup-message>
