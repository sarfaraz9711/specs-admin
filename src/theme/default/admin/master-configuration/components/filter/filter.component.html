<form (ngSubmit)="onSubmit()" class="filter-form" [formGroup]="facilityftrform">
    <div class="form-group">
        <label for="facilityCode">Facility Code
        </label>
        <input type="text" formControlName="facilityCode" class="form-control" id="facilityCode"
            aria-describedby="facilityHelp" placeholder="Facility Name" />
    </div>
    <div class="text-right filter-btns">
        <a (click)="reset()" style="cursor: pointer">Reset</a>
        <button type="submit" class="btn">ApplyFilters
        </button>
    </div>
</form>
