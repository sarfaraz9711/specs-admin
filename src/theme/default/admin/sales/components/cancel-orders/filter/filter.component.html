<form (ngSubmit)="onSubmit()" [formGroup]="salesCancelOrder" class="filter-form">
    <div class="form-group">
        <label for="keyboard">{{'Sales.Orders.Order Number'| translate}}  </label>
        <input type="text" class="form-control" id="keyboard" aria-describedby="emailHelp" formControlName="name" placeholder="{{'Sales.Orders.Order Number'| translate}}">
    </div>

    <div class="text-right filter-btns">
        <a style="cursor: pointer" (click)="reset()">{{'Sales.Orders.Reset'| translate}}</a>
        <button type="submit" class="btn">{{'Sales.Orders.ApplyFilters'| translate}}</button>
    </div>
</form>
