<input type="text" id="focusOut" style="height: 0; width: 0; opacity: 0;">
<form (ngSubmit)="onSubmit()" [formGroup]="salesOrder" class="filter-form">
    <div class="form-group">
        <label for="keyboard"> {{'Sales.Orders.OrderId'| translate}} </label>
        <input type="text" class="form-control" id="keyboard" aria-describedby="emailHelp" formControlName="orderId" placeholder="{{'Sales.SalesPlaceholder.OrderId'| translate}}">
    </div>
    <div class="form-group">
        <label for="sku">{{'Sales.Orders.CustomerName'| translate}}</label>
        <input type="text" class="form-control" formControlName="name" id="sku" placeholder="{{'Sales.SalesPlaceholder.SKUNumber'| translate}}">
    </div>
    <div class="form-group d-none">
        <label>{{'Sales.Orders.TotalAmount'| translate}} </label>
        <input appOnlyNumber type="text" class="form-control" formControlName="total" placeholder="{{'Sales.SalesPlaceholder.TotalAmount'| translate}}">

    </div>
    <div class="form-group d-none">
        <label class="control-label">{{'Sales.Orders.DateAdded'| translate}} </label>
        <input readonly style="cursor: pointer" type="text" class="form-control date" formControlName="date" (dateSelect)="onDateSelect($event)" placeholder="dd/mm/yyyy" name="dp" id="cal-in" ngbDatepicker [maxDate]="minPickerDate" #f="ngbDatepicker" (click)="f.toggle()"
        />
    </div>
    <div class="form-group">
        <label for="email">{{'Sales.Orders.Email'| translate}}</label>
        <input type="text" class="form-control" formControlName="email" id="email" placeholder="{{'Sales.Orders.Email'| translate}}">
    </div>
    <div class="form-group">
        <label for="mobileNo">{{'Sales.Orders.Mobile'| translate}}</label>
        <input type="text" class="form-control" formControlName="mobileNo" id="mobileNo" placeholder="{{'Sales.Orders.Mobile'| translate}}">
    </div>
    <div class="form-group">
        <label class="control-label">{{'Sales.Orders.DateAdded'| translate}} </label>
        <input (change)="onStartDateSelect(startdate.value)" #startdate
        style="cursor: pointer;width:100%;" type="date" class="form-control date1"
        formControlName="fromDate" />
    </div>
    <div class="form-group">
        <label class="control-label">{{'Sales.Orders.DateAddedTo'| translate}} </label>
        <input (change)="onToDateSelect(endDate.value)" #endDate
        style="cursor: pointer;width:100%;" type="date" class="form-control date1"
        formControlName="todate" />
    </div>
    <div class="text-right filter-btns">
        <a style="cursor: pointer" (click)="reset()">{{'Sales.Orders.Reset'| translate}}</a>
        <button type="submit" class="btn">{{'Sales.Orders.ApplyFilters'| translate}}</button>
    </div>
</form>
