<form [formGroup]="filterForm" class="filter-form">

    <div class="form-group get">
        <label>{{'CMS.Blog.BlogTitle'| translate}}</label>
        <input type="text" formControlName="title" class="form-control" id="Keyword" aria-describedby="emailHelp" placeholder="{{'CMS.Blog.EnterTitle'| translate}}">
    </div>
    <div class="form-group">
        <label> {{'CMS.Blog.Categories'| translate}}</label>
        <ng-select class="sol-fm" placeholder="{{'CMS.Pages.SelectCategories'| translate}}" [clearable]="false" [searchable]="false" id="inlineFormCustomSelect" formControlName="categoryNameList">
            <ng-option *ngFor="let bannerInfo of categorySandbox.getCategoriesList$ | async; let i=index" [value]='bannerInfo.categoryId'>{{bannerInfo?.name}}</ng-option>
        </ng-select>


    </div>
    <div class="text-right filter-btns">
        <a style="cursor: pointer" (click)="reset()">{{'catalog.product.Reset'| translate}}</a>
        <button type="submit" (click)="filter()" class="btn">{{'catalog.product.ApplyFilters'| translate}}</button>
    </div>
</form>
