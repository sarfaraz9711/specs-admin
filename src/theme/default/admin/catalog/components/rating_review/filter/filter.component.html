<input type="text" id="focusOut" style="height: 0; width: 0; opacity: 0;">
<form [formGroup]="filterForm" class="filter-form">
    <div class="form-group">
        <label for="keyword">{{'catalog.ratingReview.Keyword'| translate}}</label>
        <input type="text" formControlName="keyword" class="form-control" id="Keyword" aria-describedby="emailHelp" placeholder="{{'catalog.ratingReview.EnterProductName'| translate}}">
    </div>
    <div class="text-right filter-btns">
        <a style="cursor: pointer" (click)="reset()">{{'catalog.product.Reset'| translate}}</a>
        <button type="submit" (click)="filter()" class="btn">{{'catalog.product.ApplyFilters'| translate}}</button>
    </div>
</form>
