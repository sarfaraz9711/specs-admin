<div class="mt-3 container-fluid row">
    <div class="col-md-9"></div>
    <form class="validateForm col-md-3" [formGroup]="exportReportForm">

        <div class="d-flex">
            <select class="form-control" formControlName="employeeStatus">
                <option value="">--Select--</option>
                <option value="1"> Active</option>
                <option value="0">In Active</option>
            </select>

            <div class="ml-2 bc-col-btn">
                <input type="button" value="Export Data" class="btn" [disabled]="exportReportForm.invalid"
                    (click)="exportAsXLSX()">
            </div>
            
            <div class="ml-2 bc-col-btn">
                <input type="button" value="Order By Employee" class="btn" (click)="employeesexportAsXLSX()">
            </div>

        </div>
    </form>
</div>
<hr />

<div class="add-empolyee">
    <div>
        <h4>Add Employee</h4>
    </div>
    <div class="bc-col-btn ap-col-btn flex search-exp bulk-header justify-content-end">
        <a href="assets/demo/employeeDiscountSheetSample.csv" class="ripple flex bluk-upload" download> <img
                src="assets/img/download-white.svg" alt="download"> {{'catalog.product.Download Zip File'|
            translate}}</a>
    </div>
</div>
<form class="container-fluid bdr-btm mt-2" [formGroup]="updateemployeeForm" id="validateForm">
    <input type="file" id="addfileUpload" class="form-control" (change)="onaddUpload($event)">
    <div class="all-btn flex justify-content-center">
        <button type="submit" class="ripple allocate align-self-end" (click)="adduploadSuccess()">
            <span>{{'Upload'| translate}}</span></button>
        <button class="ripple" (click)="addreset(fileInput)">{{'Reset'| translate}}</button>

    </div>
</form>

<hr />

<div class="add-empolyee">
    <div>
        <h4>Update Employee</h4>
    </div>
    <div class="bc-col-btn ap-col-btn flex search-exp bulk-header justify-content-end">
        <a href="assets/demo/activeinactiveemployee.csv" class="ripple flex bluk-upload" download> <img
                src="assets/img/download-white.svg" alt="download"> {{'catalog.product.Download Zip File'|
            translate}}</a>
    </div>
</div>
<form class="container-fluid bdr-btm mt-2" [formGroup]="updateemployeeForm" id="validateForm">
    <input type="file" id="updatefileUpload" class="form-control" (change)="onupdateUpload($event)">
    <div class="all-btn flex justify-content-center">
        <button type="submit" class="ripple allocate align-self-end" (click)="updateuploadSuccess()">
            <span>{{'Upload'| translate}}</span></button>
        <button class="ripple" (click)="updatereset(fileInput)">{{'Reset'| translate}}</button>

    </div>
</form>
<hr />
<app-popup-message [popupMessage]="popupMessage"></app-popup-message>
