<form [formGroup]="appointmentForm" (ngSubmit)="onSubmit()">
    <div class="row products-section" style="margin:unset">
        <div class="col-12">
            <div class="breadcrumbs-row noborder">
                <div class="bc-col"></div>
                <div class="bc-col-btn ap-col-btn">
                    <button class="btn btn-save" type="submit">
                        <img src="assets/img/tick-round-white.png" alt="save" />
                        Save
                    </button>
                </div>
            </div>
        </div>
    </div>

    <div class="flex addproduct-wrap">
        <div class="card ap-general">
            <div class="ap-header">Appointments</div>
            <div class="flex ap-body">

                <div class="ap-body-col">
                    <div class="form-group">
                        <label>Calendar Period (in days):</label><br />
                        <input type="number" formControlName="calendarPeriod" class="form-control" />
                    </div>
                </div>

                <div class="ap-body-col">
                    <div class="form-group">
                        <div class="d-flex justify-content-between align-items-center mb-4">
                            <label>Booking Not Allowed Days:</label>
                            <button type="button" class="btn btn-secondary btn-sm" (click)="addDate()">+ Add
                                Date</button>
                        </div>

                        <div *ngFor="let dateCtrl of bookingNotAllowedDays.controls; let i = index"
                            class=" d-flex align-items-center">                                
                                <input type="date" [formControl]="dateCtrl" class="form-control" />
                            <button type="button" class="btn btn-danger btn-sm ml-2"
                                (click)="removeDate(i)">Remove</button>
                        </div>
                    </div>
                </div>

                <div class="ap-body-col">
                    <div class="form-group">
                        <label>Saturday Off:</label><br />
                        <select formControlName="saturdayOff" class="form-control">
                            <option value="YES">YES</option>
                            <option value="NO">NO</option>
                        </select>
                    </div>
                </div>

                <div class="ap-body-col">
                    <div class="form-group">
                        <label>Sunday Off:</label><br />
                        <select formControlName="sundayOff" class="form-control">
                            <option value="YES">YES</option>
                            <option value="NO">NO</option>
                        </select>
                    </div>
                </div>

                <div class="ap-body-col">
                    <div class="form-group">
                        <label>Start Time:</label><br />
                        <input type="time" formControlName="startTime" class="form-control" />
                    </div>
                </div>

                <div class="ap-body-col">
                    <div class="form-group">
                        <label>End Time:</label><br />
                        <input type="time" formControlName="endTime" class="form-control" />
                    </div>
                </div>

            </div>
        </div>
    </div>
</form>
